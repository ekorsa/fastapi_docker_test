version: '3.8'

services:
  # FastAPI application service
  fastapi_app:
    build: .
    container_name: fastapi_app
    ports:
      - "8000:8000"
    environment:
      - ENV_NAME=docker-compose-dev

  # Prometheus monitoring service
  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      # Mount the local configuration file into the Prometheus container
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - fastapi_app

  grafana:
    image: grafana/grafana:10.2.0
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      # Mount configuration files for automatic data sources and dashboard provisioning
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
